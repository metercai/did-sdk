name: node
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: client
            binding: bindings/node
            install: npm ci
          - name: server
            binding: bindings/node-server
            install: npm install
        target:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zig (musl cross)
        if: contains(matrix.target.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - run: cd ${{ matrix.variant.binding }} && ${{ matrix.variant.install }}
      - name: Build addon
        shell: bash
        run: |
          if [[ "${{ matrix.target.target }}" == *musl* ]]; then
            cd ${{ matrix.variant.binding }} && npx napi build --platform --release --target ${{ matrix.target.target }} --zig
          else
            cd ${{ matrix.variant.binding }} && npx napi build --platform --release --target ${{ matrix.target.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: addons-${{ matrix.variant.name }}-${{ matrix.target.target }}
          path: ${{ matrix.variant.binding }}/*.node
