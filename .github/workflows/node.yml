name: node
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zig (musl cross)
        if: contains(matrix.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - run: cd bindings/node && npm ci
      - name: Build addon
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            cd bindings/node && npx napi build --platform --release --target ${{ matrix.target }} --zig
          else
            cd bindings/node && npx napi build --platform --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: addons-${{ matrix.target }}
          path: bindings/node/*.node
