name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude did-sdk-python --exclude did-sdk-python-server --exclude did-sdk-node --exclude did-sdk-node-server --all-targets -- -D warnings
      - name: Check no chain/subxt boundary
        run: |
          ! grep -q 'subxt' Cargo.toml
          ! cargo tree -p did-sdk | grep -q subxt
          ! grep -RIn --include='*.rs' 'fn get_anchor' src
      - name: Test
        run: cargo test --locked --workspace --exclude did-sdk-python --exclude did-sdk-python-server --exclude did-sdk-node --exclude did-sdk-node-server
