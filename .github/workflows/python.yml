name: python
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: client
            binding: bindings/python
          - name: server
            binding: bindings/python-server
        target:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            maturin_args: --release --out dist -i python3.12
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            maturin_args: --release --out dist -i python3.12
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            maturin_args: --release --out dist -i python3.12
          - target: aarch64-apple-darwin
            os: macos-15
            maturin_args: --release --out dist
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            maturin_args: --release --out dist
    runs-on: ${{ matrix.target.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: messense/maturin-action@v1
        with:
          target: ${{ matrix.target.target }}
          working-directory: ${{ matrix.variant.binding }}
          args: ${{ matrix.target.maturin_args }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.variant.name }}-${{ matrix.target.target }}
          path: ${{ matrix.variant.binding }}/dist/*.whl
