[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "did-sdk-client"
version = "0.2.1"
description = "DID SDK Client Python binding (Mock/Centralized modes)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "did_sdk._did_sdk"
python-source = "python"
strip = true
